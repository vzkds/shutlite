name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows é onde o shutlite roda: versão mínima suportada e a mais nova
          - { os: windows-latest, python: "3.9" }
          - { os: windows-latest, python: "3.13" }
          # Ubuntu garante que os testes não dependem do Windows
          - { os: ubuntu-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Testes
        run: python -m unittest discover -s tests -v
