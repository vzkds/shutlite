name: Release

# Ao enviar uma tag vX.Y.Z: testa, gera o shutlite.exe, confere se ele sobe e publica a release
# com o .exe, o código-fonte em .zip e os SHA-256.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write  # criar a release e anexar os arquivos
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: A tag bate com a versão do server.py
        run: |
          version=$(python -c "import re,pathlib;print(re.search(r'^__version__ = \"([^\"]+)\"', pathlib.Path('server.py').read_text(encoding='utf-8'), re.M).group(1))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::a tag $GITHUB_REF_NAME não bate com __version__ = $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Testes
        run: python -m unittest discover -s tests

      - name: Gera o shutlite.exe
        run: |
          python -m pip install "pyinstaller==6.22.3"
          python packaging/make_version_info.py
          pyinstaller --noconfirm --clean packaging/shutlite.spec

      - name: Confere se o .exe sobe (modo simulação)
        run: |
          exe=dist/shutlite.exe
          data="$RUNNER_TEMP/shutlite-data"
          "$exe" --version | grep -q "shutlite $VERSION"
          "$exe" --data-dir "$data" --port 3398 --bind 127.0.0.1 --dry-run &
          for i in $(seq 1 20); do
            "$exe" --data-dir "$data" --port 3398 --check && break
            sleep 1
          done
          curl -sf http://127.0.0.1:3398/ | grep -q shutlite
          curl -sf http://127.0.0.1:3398/qrcode.min.js | grep -q QRCode
          "$exe" --data-dir "$data" --port 3398 --stop

      - name: Monta os arquivos da release
        run: |
          mkdir -p out
          cp dist/shutlite.exe "out/shutlite-$VERSION.exe"
          git archive --format=zip --prefix="shutlite-$VERSION/" -o "out/shutlite-$VERSION-codigo.zip" HEAD
          cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Notas da versão (CHANGELOG.md)
        run: |
          awk -v v="## $VERSION" '$0 ~ "^## " { on = (index($0, v) == 1) ; next } on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md não tem a seção ## $VERSION"
            exit 1
          fi

      - name: Publica
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "shutlite $VERSION" --notes-file notes.md --verify-tag
